name: Auto Patch Release

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: localeguard-auto-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse stale or generated deployment results
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$VALIDATED_SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its Pages run will own the next release."
            exit 0
          fi
          subject="$(git show -s --format=%s "$VALIDATED_SHA")"
          case "$subject" in
            "chore(release):"*)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Generated release commit; refusing recursive patch release."
              exit 0
              ;;
          esac
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.candidate.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Compute next patch version
        if: steps.candidate.outputs.release == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Update package version
        if: steps.candidate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Commit release metadata
        if: steps.candidate.outputs.release == 'true'
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag exact release commit
        if: steps.candidate.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing release tag $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub release
        if: steps.candidate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          gh release create "$TAG"
          --verify-tag
          --target "$RELEASE_SHA"
          --generate-notes
          --title "LocaleGuard $TAG"